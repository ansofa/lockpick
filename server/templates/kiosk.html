<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiosk - Lockpick Training System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* Override khusus untuk Kiosk mode (Layar penuh, tanpa scroll) */
    body {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .main {
      padding-top: 0 !important;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      transform: scale(1.15); /* Diperbesar agar jelas di monitor Raspberry Pi */
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <!-- Background decorations -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-glow-bottom" aria-hidden="true"></div>

  <!-- Main content (No Header for Kiosk) -->
  <main class="main" id="main-content" role="main">

    <!-- STATE: IDLE -->
    <section id="state-idle" class="state-panel active" aria-label="Halaman mulai">
      <div class="card" role="region">
        <h1 class="main-title">
          LOCKPICK<br>
          <span class="main-title-sub">TRAINING SYSTEM</span>
        </h1>

        <form id="start-form" class="form" novalidate>
          <div class="field-wrap">
            <input
              type="text"
              id="player-name-input"
              name="player_name"
              class="field-input"
              placeholder=" "
              maxlength="30"
              autocomplete="off"
              required
            />
            <label class="field-label" for="player-name-input">ID PESERTA</label>
            <div class="field-bar"></div>
          </div>
          <p id="form-error" class="form-error" role="alert"></p>
          <button type="submit" class="btn btn-start" id="btn-start">
            <span class="btn-icon" aria-hidden="true">▶</span> MULAI EVALUASI
          </button>
        </form>
      </div>
    </section>

    <!-- STATE: READY -->
    <section id="state-ready" class="state-panel" aria-label="Bersiap mulai">
      <div class="card card-ready" role="region">
        <h2 class="success-title" style="color: var(--blue); font-size: 2rem;">STANDBY</h2>
        
        <div class="player-chip" id="ready-player-name">
          <span aria-hidden="true">👤</span> —
        </div>

        <div class="door-pill" id="ready-door-pill" role="status" aria-live="polite" style="margin-top: 1rem;">
          <span class="door-dot locked" id="ready-door-dot"></span>
          <span id="ready-door-text">Mengecek sensor…</span>
        </div>
        
        <p class="subtitle" style="margin-top: 1.5rem; margin-bottom: 2rem; max-width: 300px; margin-left: auto; margin-right: auto;">
          Sistem siap. Waktu akan dihitung seketika saat tombol ditekan.
        </p>
        
        <button class="btn btn-start" id="btn-start-ready" onclick="startReadySession()" style="width: 100%; margin-bottom: 1rem;">
          <span class="btn-icon" aria-hidden="true">▶</span> MULAI EVALUASI
        </button>
        
        <button class="btn btn-outline" id="btn-cancel-ready" onclick="resetSession()" style="width: 100%;">
          BATALKAN
        </button>
      </div>
    </section>

    <!-- STATE: RUNNING -->
    <section id="state-running" class="state-panel" aria-label="Sesi berjalan">
      <div class="card card-running" role="region">
        <div class="player-chip" id="running-player-name">
          <span aria-hidden="true">👤</span> —
        </div>
        <div class="timer-wrap" role="timer" aria-label="Waktu berlalu">
          <div class="timer" id="timer-display" aria-live="off">00:00.000</div>
          <div class="timer-label">ELAPSED TIME</div>
        </div>
        <div class="door-pill large" id="running-door-pill" role="status">
          <span class="door-dot locked pulse" id="running-door-dot"></span>
          <span id="running-door-text">DEADBOLT AKTIF</span>
        </div>
        <p class="mission-hint">Buka deadbolt secepat mungkin.</p>
        <button class="btn btn-reset" id="btn-reset-running" onclick="resetSession()">
          <span aria-hidden="true">↺</span> RESET
        </button>
      </div>
    </section>

    <!-- STATE: STOPPED -->
    <section id="state-stopped" class="state-panel" aria-label="Sesi selesai">
      <div class="card card-success" role="region">
        <div class="success-trophy" aria-hidden="true">✅</div>
        <h2 class="success-title">SIMULASI SELESAI</h2>
        <p class="subtitle" style="margin-bottom: 10px;">Evaluasi waktu pembobolan:</p>
        <div class="player-chip" id="stopped-player-name">
          <span aria-hidden="true">👤</span> —
        </div>
        <div class="result-time" id="result-time-display" role="status">00:00.000</div>
        <div class="result-label">TOTAL WAKTU</div>
        <div class="result-actions">
          <button class="btn btn-start" id="btn-play-again" onclick="resetSession()">
            <span class="btn-icon" aria-hidden="true">🔄</span> ULANGI SIMULASI
          </button>
        </div>
      </div>
    </section>

  </main>

  <div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- Scripts -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="/static/app.js"></script>
</body>
</html>
